name: Import source tree
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: |
          base64 -d import/source.b64 | xz -dc | tar -x
      - name: Commit source tree
        run: |
          rm -rf import .github/workflows/import-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import source tree' || true
          git push
